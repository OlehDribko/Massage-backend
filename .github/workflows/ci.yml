# CI for the booking service: code checks, integration tests (migrations,
# privileges, Firebase auth and profiles), a smoke test of the built Docker
# images, static Terraform checks and tests of the staging deploy scripts.
# No secrets, no external services (Neon, Brevo, real Firebase projects, AWS):
# Firebase is only the local Auth Emulator with a demo- project. No image
# publishing, no terraform plan/apply, no deploy.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with compose.yaml (checked by test/postgres-image.test.ts).
  POSTGRES_IMAGE: postgres:17.11-bookworm
  # Never read a .env file in CI; Prisma telemetry/update checks off.
  DOTENV_CONFIG_PATH: /dev/null
  CHECKPOINT_DISABLE: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  code:
    name: code (lint, typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Tool versions (openssl is required by the TLS tests)
        run: |
          node --version
          npm --version
          openssl version
      - run: npm ci
      - name: Prisma generate (no database)
        run: npm run prisma -- generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, process and TLS tests
        run: npm test
      - run: npm run build

  integration:
    name: integration (migrations, privileges, auth emulator, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prisma generate (no database)
        run: npm run prisma -- generate
      - name: Pull PostgreSQL image
        run: docker pull "$POSTGRES_IMAGE"
      # firebase-tools pinned in the emulator:auth script; demo- project ids
      # never reach a real Firebase project and need no credentials.
      - name: Start Firebase Auth Emulator
        run: |
          npm run emulator:auth -w @massage/booking > "$RUNNER_TEMP/auth-emulator.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:9099/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/auth-emulator.log"
          exit 1
      - name: Integration tests (migrations, privileges, auth/profiles via emulator, marketing)
        env:
          INTEGRATION_POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: npm run test:integration
      - name: Remove leftover test containers
        if: always()
        run: docker ps -aq --filter label=massage-booking.integration-test=1 | xargs -r docker rm -f

  docker:
    name: docker (runtime and migrate images, linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOOKING_RUNTIME_IMAGE: massage-booking-api:ci-${{ github.run_id }}-${{ github.run_attempt }}
      BOOKING_MIGRATE_IMAGE: massage-booking-migrate:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build runtime image
        run: docker build --platform linux/amd64 -f services/booking/Dockerfile --target runtime -t "$BOOKING_RUNTIME_IMAGE" .
      - name: Build migrate image
        run: docker build --platform linux/amd64 -f services/booking/Dockerfile --target migrate -t "$BOOKING_MIGRATE_IMAGE" .
      - name: Check image platform
        run: |
          for image in "$BOOKING_RUNTIME_IMAGE" "$BOOKING_MIGRATE_IMAGE"; do
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            echo "$image: $platform"
            test "$platform" = "linux/amd64"
          done
      - name: Pull PostgreSQL image
        run: docker pull "$POSTGRES_IMAGE"
      - name: Smoke test (migrate twice, privileges, live/ready/legacy, non-root, SIGTERM)
        env:
          INTEGRATION_POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
        run: npm run test:smoke
      - name: Remove test containers, networks and images
        if: always()
        run: |
          docker ps -aq --filter label=massage-booking.smoke-test=1 | xargs -r docker rm -f
          docker network ls -q --filter label=massage-booking.smoke-test=1 | xargs -r docker network rm
          docker image rm "$BOOKING_RUNTIME_IMAGE" "$BOOKING_MIGRATE_IMAGE" || echo "images already removed"

  # Static Terraform checks only: no AWS credentials, no backend, no plan/apply.
  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform version
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: "bootstrap: init (no backend, lock file must match)"
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: "bootstrap: validate"
        working-directory: infra/bootstrap
        run: terraform validate
      - name: "staging: init (no backend, lock file must match)"
        working-directory: infra/environments/staging
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: "staging: validate"
        working-directory: infra/environments/staging
        run: terraform validate

  # Staging deploy scripts: static analysis and tests with fixtures (no AWS).
  deploy-scripts:
    name: deploy scripts (shellcheck, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR .github/scripts/staging-deploy/*.sh
      - name: Tests
        run: bash .github/scripts/staging-deploy/test.sh

  # Single stable status for branch protection: "CI / required".
  required:
    name: required
    if: always()
    needs: [code, integration, docker, terraform, deploy-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          CODE: ${{ needs.code.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DOCKER: ${{ needs.docker.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          DEPLOY_SCRIPTS: ${{ needs.deploy-scripts.result }}
        run: |
          echo "code=$CODE integration=$INTEGRATION docker=$DOCKER terraform=$TERRAFORM deploy-scripts=$DEPLOY_SCRIPTS"
          for result in "$CODE" "$INTEGRATION" "$DOCKER" "$TERRAFORM" "$DEPLOY_SCRIPTS"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed ($result)"
              exit 1
            fi
          done
